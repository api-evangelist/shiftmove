aid: shiftmove
name: Shiftmove
description: >-
  Shiftmove GmbH is a Berlin-based European fleet management software company backed by
  Battery Ventures, operating the Vimcar, Fleet, Avrios, Optimum and Océan brands and
  managing 730,000+ vehicles for 25,000+ fleet customers. Its developer surface is the
  Avrios Fleet-API, a Swagger 2.0 REST API (base URL https://api.avrios.com) that syncs
  fleet data — vehicles, drivers, driver/vehicle assignments, license plates, vehicle
  financing, usages, invoices, organizations and custom fields — with the Avrios/Shiftmove
  platform. The API uses HTTP Basic authentication, is rate limited to 300 requests per
  minute, exposes 40 operations across ten resource groups, follows semantic versioning,
  and returns page-number paginated responses.
