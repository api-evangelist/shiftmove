rate_limiting:
  limit: 300
  window: per-minute
  documented: true
  ref: rate-limits/shiftmove-rate-limits.yml
idempotency:
  supported: false
  notes: >-
    The Avrios Fleet-API does not document an idempotency-key mechanism. Writes
    are modeled as explicit POST create/update operations; assignment/license-plate
    conflicts are surfaced as 409 with the conflicting entities returned.
null_handling:
  response: >-
    Only populated fields are returned; null fields are stripped from response
    objects.
  update: >-
    Update endpoints only modify properties present in the request (all properties
    optional). A property can be explicitly cleared by sending `null`.
date_interpretation: >-
  Some endpoints accept dates as `yyyy-MM-dd` rather than timestamps. For
  filtering/business logic these are interpreted as the first second of the day
  in the company timezone (e.g. `2020-01-01` in CET becomes 2019-12-31T23:00:00Z).
